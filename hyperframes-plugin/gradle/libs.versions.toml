[versions]
hyperframes = "0.1.0-SNAPSHOT"
kotlin = "2.3.20"
asciidoctorj = "3.0.0"
junit-jupiter = "5.12.2"
junit-platform-launcher = "1.12.2"
plugin-publish = "1.3.1"
slf4j = "2.0.17"
logback = "1.5.32"
node-gradle = "7.1.0"
jackson = "2.21.2"

[libraries]
asciidoctorj = { module = "org.asciidoctor:asciidoctorj", version.ref = "asciidoctorj" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform-launcher" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
node-gradle = { module = "com.github.node-gradle:gradle-node-plugin", version.ref = "node-gradle" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }

[plugins]
hyperframes = { id = "education.cccp.hyperframes", version.ref = "hyperframes" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
plugin-publish = { id = "com.gradle.plugin-publish", version.ref = "plugin-publish" }
