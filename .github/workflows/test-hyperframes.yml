name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (unit + functional + Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile plugin
        run: ./gradlew compileKotlin
        working-directory: hyperframes-plugin

      - name: Run unit and functional tests
        run: ./gradlew test
        working-directory: hyperframes-plugin

      - name: Run Cucumber BDD tests
        run: ./gradlew cucumberTest
        working-directory: hyperframes-plugin

      - name: Full check (validation + plugin descriptors)
        run: ./gradlew check
        working-directory: hyperframes-plugin