name: Test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Build & Test (unit + functional + Cucumber)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: cccpeducation/cccp-ci-base@sha256:4722c1bcc71c0343c05257842b774715fc2574ff79182599a29fe8c1361cbeb3

    steps:
      - uses: actions/checkout@v4
      - name: Verify Gradle wrapper version
        uses: cccp-education/conventions-gradle/.github/actions/verify-gradle-wrapper@main

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # GBL-013 US-5 — the runtime image provides JDK 25; `ci/run.sh test` runs
      # compile, unit, functional, Cucumber and plugin validation via `check`.
      - name: Build and test
        run: ci/run.sh test