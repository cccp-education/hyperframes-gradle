name: Real Render (HF-CR3)

# HF-CR3-2 — real HyperFrames CLI render + MP4 duration probe.
#
# This workflow is intentionally NOT part of the required `Test` workflow: the
# real render needs Node.js, the `hyperframes` npm package (Puppeteer/Chromium)
# and ffmpeg, which makes it slow and network-dependent. It runs on demand
# (`workflow_dispatch`) and weekly, so it never blocks the hermetic CI.
#
# The integration scenario (`cr3_real_render.feature`) is skip-guarded
# (`assumeTrue`): when any prerequisite is missing it is *skipped*, never a
# false success. On this runner every prerequisite is installed, so the render
# must actually happen; the standalone `ffprobe` step below fails the job when
# no playable MP4 was produced.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'

jobs:
  real-render:
    name: Real render + duration probe
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HyperFrames CLI
        working-directory: hyperframes-plugin
        run: npm install hyperframes@0.8.157

      - name: HyperFrames doctor (informational)
        working-directory: hyperframes-plugin
        run: npx hyperframes doctor
        continue-on-error: true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile plugin
        working-directory: hyperframes-plugin
        run: ./gradlew compileKotlin compileTestKotlin

      - name: Real render acceptance (skip-guarded)
        working-directory: hyperframes-plugin
        env:
          HF_HYPERFRAMES_CLI: ${{ github.workspace }}/hyperframes-plugin/node_modules/.bin/hyperframes
          HF_REAL_RENDER_OUTPUT: ${{ github.workspace }}/hyperframes-plugin/build/real-render
        run: ./gradlew cucumberTestCr3RealRender --info

      - name: Probe the produced MP4 duration (ffprobe)
        working-directory: hyperframes-plugin
        run: |
          MP4=$(find build/real-render -name '*.mp4' -type f | head -n 1)
          if [ -z "$MP4" ]; then
            echo "::error::No MP4 was produced by the real render"
            exit 1
          fi
          SIZE=$(stat -c%s "$MP4")
          if [ "$SIZE" -le 0 ]; then
            echo "::error::Produced MP4 is empty: $MP4"
            exit 1
          fi
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=nw=1:nk=1 "$MP4")
          echo "Produced MP4: $MP4 ($SIZE bytes, ${DURATION}s)"
          awk "BEGIN { exit !($DURATION > 0) }" || {
            echo "::error::Produced MP4 duration is not positive: $DURATION"
            exit 1
          }

      - name: Upload rendered MP4
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-render-mp4
          path: hyperframes-plugin/build/real-render/*.mp4
          if-no-files-found: warn
